name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    name: Validate
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [24]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.3.4

      - name: Install dependencies (frozen lockfile)
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Format check
        run: pnpm format:check

      - name: Build
        run: pnpm build

      - name: Typecheck
        run: pnpm typecheck

      - name: M06 provider binding and accepted transport regression
        run: |
          node integrations/n8n/m06/live/build.mjs
          git diff --exit-code -- integrations/n8n/m06/live/workflow.json
          node --test integrations/n8n/m06/contract/p01.test.mjs integrations/n8n/m06/p02/p02.test.mjs integrations/n8n/m06/p03/p03.test.mjs integrations/n8n/m06/p04/p04.test.mjs integrations/n8n/m06/live/live.test.mjs

      - name: M06 Evolution 2.3.7 logging patch and synthetic leak tests
        run: |
          bash integrations/evolution/prepare.sh "$RUNNER_TEMP/evolution-m06-patched"
          docker build --tag evolution-m06-logging:ci "$RUNNER_TEMP/evolution-m06-patched"

      - name: M06 n8n 2.23.3 isolated import and runtime
        run: bash integrations/n8n/m06/live/test-runtime.sh

      - name: M06 opt-in transport Compose
        env:
          FINANCE_LAB_UID: '1000'
          FINANCE_LAB_GID: '1000'
        run: |
          docker compose --profile maintenance -f infra/finance-lab/compose.yml -f infra/finance-lab/transport.compose.yml config --format json > /tmp/m06-compose.json
          node integrations/n8n/m06/live/check-network.mjs /tmp/m06-compose.json
          bash integrations/n8n/m06/live/test-n8n-network.sh

      - name: Finance Lab Compose validation
        env:
          FINANCE_LAB_UID: '1000'
          FINANCE_LAB_GID: '1000'
        run: docker compose -f infra/finance-lab/compose.yml config --quiet

      - name: Finance API image build
        env:
          FINANCE_LAB_UID: '1000'
          FINANCE_LAB_GID: '1000'
        run: docker compose -f infra/finance-lab/compose.yml build api

      - name: Finance API final image runtime test
        run: bash infra/finance-lab/test-runtime-image.sh

      - name: Finance Lab non-root secret mount
        run: bash infra/finance-lab/test-secret-read.sh

      - name: Finance Lab sudo Docker secret mount
        env:
          FINANCE_LAB_FORCE_SUDO_DOCKER: '1'
        run: bash infra/finance-lab/test-secret-read.sh

      - name: Unit tests
        run: pnpm test

      - name: Integration tests (PostgreSQL via Testcontainers)
        run: pnpm test:integration:postgres
        env:
          TESTCONTAINERS_HOST_OVERRIDE: localhost

      - name: M06 five-command acceptance (PostgreSQL, simulated provider)
        run: pnpm exec vitest run --config integrations/n8n/m06/p05/vitest.config.ts
        env:
          TESTCONTAINERS_HOST_OVERRIDE: localhost
