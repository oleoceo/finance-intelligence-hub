# Staging target: /opt/apps/apps/databases/postgres-products
# REVIEW REQUIRED. Do not run before Gate 0 PASS and INFRA-T01 approval.
services:
  postgres-products:
    image: postgres:18.6-bookworm@sha256:5c4783a8cc3f0074912164f94dfa1be4e043438f0f707cf968d7af9a0d31a2c8
    platform: linux/amd64
    container_name: postgres-products
    restart: unless-stopped
    environment:
      POSTGRES_DB: finance_hub_lab
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
    secrets:
      - postgres_password
    volumes:
      - postgres_products_data:/var/lib/postgresql
    networks:
      - finance-products-db
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d finance_hub_lab']
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 40s
    security_opt:
      - no-new-privileges:true
    pids_limit: 256
    stop_grace_period: 60s
secrets:
  postgres_password:
    file: ./secrets/postgres_password
volumes:
  postgres_products_data:
    name: finance_postgres_products_data
networks:
  finance-products-db:
    name: finance-products-db
    driver: bridge
    internal: true
