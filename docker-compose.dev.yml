version: '3.8'

services:
  postgres:
    image: postgres:18.6-bookworm
    container_name: finance-hub-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: finance_hub_dev
      POSTGRES_USER: finance_hub_user
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
    ports:
      - '127.0.0.1:5432:5432'
    volumes:
      - finance-hub-data:/var/lib/postgresql
    networks:
      - finance-hub-network
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U finance_hub_user -d finance_hub_dev']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

volumes:
  finance-hub-data:
    name: finance-hub-data

networks:
  finance-hub-network:
    name: finance-hub-network
    driver: bridge
