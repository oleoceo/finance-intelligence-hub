name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    name: Validate
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [24]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.3.4

      - name: Install dependencies (frozen lockfile)
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Format check
        run: pnpm format:check

      - name: Build
        run: pnpm build

      - name: Typecheck
        run: pnpm typecheck

      - name: Finance Lab Compose validation
        env:
          FINANCE_LAB_UID: '1000'
          FINANCE_LAB_GID: '1000'
        run: docker compose -f infra/finance-lab/compose.yml config --quiet

      - name: Finance API image build
        env:
          FINANCE_LAB_UID: '1000'
          FINANCE_LAB_GID: '1000'
        run: docker compose -f infra/finance-lab/compose.yml build api

      - name: Finance Lab non-root secret mount
        run: bash infra/finance-lab/test-secret-read.sh

      - name: Finance Lab sudo Docker secret mount
        env:
          FINANCE_LAB_FORCE_SUDO_DOCKER: '1'
        run: bash infra/finance-lab/test-secret-read.sh

      - name: Unit tests
        run: pnpm test

      - name: Integration tests (PostgreSQL via Testcontainers)
        run: pnpm test:integration:postgres
        env:
          TESTCONTAINERS_HOST_OVERRIDE: localhost
